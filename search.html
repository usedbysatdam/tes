<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Pencarian - YouTube Kids Clone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #ff0000;
            color: white;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .search-bar {
            display: flex;
            align-items: center;
        }
        .search-bar input {
            padding: 5px;
            border: none;
            border-radius: 4px;
            margin-right: 10px;
        }
        .search-bar button {
            background-color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        main {
            padding: 20px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .video-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .video-thumbnail {
            width: 100%;
            height: 150px;
            background-color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #666;
        }
        .video-thumbnail img {
            cursor: pointer;
        }
        .video-info {
            padding: 10px;
        }
        .video-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .video-channel {
            color: #666;
            font-size: 14px;
        }
        nav {
            background-color: #fff;
            border-bottom: 1px solid #ddd;
            padding: 10px 20px;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }
        nav a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        nav a:hover {
            color: #ff0000;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
        }
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }
        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube Logo" height="30"></div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Cari video...">
            <button onclick="performSearch()">Cari</button>
        </div>
    </header>
    <nav>
        <ul>
            <li><a href="index.html" title="Beranda">🏠</a></li>
            <li><a href="acara.html" title="Acara">🍿</a></li>
            <li><a href="musik.html" title="Musik">🎵</a></li>
            <li><a href="belajar.html" title="Belajar">📚</a></li>
            <li><a href="jelajahi.html" title="Jelajahi">➡️</a></li>
        </ul>
    </nav>
    <main>
        <h2 id="searchTitle">Hasil Pencarian</h2>
        <div class="video-grid" id="resultsGrid">
        </div>
        <div class="no-results" id="noResults" style="display: none;">
            <p>Tidak ada video yang ditemukan untuk pencarian "<span id="queryDisplay"></span>"</p>
            <a href="index.html" class="back-link">Kembali ke Beranda</a>
        </div>
    </main>
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>
    <script>
        const allVideos = [
            { title: "Belajar Hewan", channel: "Channel Edukasi", page: "index.html", color: "FFD700" },
            { title: "Lagu Anak-Anak", channel: "Channel Musik", page: "index.html", color: "FF69B4" },
            { title: "Cerita Dongeng", channel: "Channel Cerita", page: "index.html", color: "87CEEB" },
            { title: "Belajar Matematika", channel: "Channel Belajar", page: "index.html", color: "98FB98" },
            { title: "Animasi Seru", channel: "Channel Animasi", page: "index.html", color: "FFA07A" },
            { title: "Eksplorasi Alam", channel: "Channel Sains", page: "index.html", color: "20B2AA" },
            { title: "Petualangan Dora", channel: "Channel Kartun", page: "acara.html", color: "FF6B6B" },
            { title: "SpongeBob SquarePants", channel: "Channel Kartun", page: "acara.html", color: "FFD93D" },
            { title: "Paw Patrol", channel: "Channel Kartun", page: "acara.html", color: "6BCB77" },
            { title: "Mickey Mouse Clubhouse", channel: "Channel Kartun", page: "acara.html", color: "4D96FF" },
            { title: "Peppa Pig", channel: "Channel Kartun", page: "acara.html", color: "FF8B8B" },
            { title: "Bluey", channel: "Channel Kartun", page: "acara.html", color: "9B59B6" },
            { title: "Twinkle Twinkle Little Star", channel: "Channel Nursery Rhymes", page: "musik.html", color: "FFE4E1" },
            { title: "Baby Shark", channel: "Channel Musik Anak", page: "musik.html", color: "FFB6C1" },
            { title: "Wheels on the Bus", channel: "Channel Lagu Anak", page: "musik.html", color: "FFFACD" },
            { title: "ABC Song", channel: "Channel Edukasi Musik", page: "musik.html", color: "E0FFFF" },
            { title: "Head Shoulders Knees and Toes", channel: "Channel Gerak Musik", page: "musik.html", color: "F0E68C" },
            { title: "Happy Birthday Song", channel: "Channel Ulang Tahun", page: "musik.html", color: "FFA500" },
            { title: "Belajar Matematika Dasar", channel: "Channel Edukasi", page: "belajar.html", color: "98FB98" },
            { title: "Belajar Bahasa Inggris", channel: "Channel Bahasa", page: "belajar.html", color: "87CEFA" },
            { title: "Belajar Sains untuk Anak", channel: "Channel Sains", page: "belajar.html", color: "FFB6C1" },
            { title: "Belajar Membaca", channel: "Channel Edukasi", page: "belajar.html", color: "DDA0DD" },
            { title: "Belajar Hewan dan Alam", channel: "Channel Alam", page: "belajar.html", color: "90EE90" },
            { title: "Belajar Seni dan Kreativitas", channel: "Channel Seni", page: "belajar.html", color: "FFA07A" },
            { title: "Petualangan di Hutan", channel: "Channel Alam", page: "jelajahi.html", color: "228B22" },
            { title: "Jelajahi Laut Dalam", channel: "Channel Oseanografi", page: "jelajahi.html", color: "00CED1" },
            { title: "Perjalanan ke Planet Lain", channel: "Channel Luar Angkasa", page: "jelajahi.html", color: "8A2BE2" },
            { title: "Misteri Dunia Kuno", channel: "Channel Sejarah", page: "jelajahi.html", color: "D2691E" },
            { title: "Eksplorasi Ruang Angkasa", channel: "Channel Sains", page: "jelajahi.html", color: "191970" },
            { title: "Petualangan di Pegunungan", channel: "Channel Alam", page: "jelajahi.html", color: "808080" }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || '';

        document.getElementById('searchInput').value = query;
        
        function performSearch() {
            const searchQuery = document.getElementById('searchInput').value.trim();
            if (searchQuery) {
                window.location.href = 'search.html?q=' + encodeURIComponent(searchQuery);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        function searchVideos(query) {
            if (!query) return [];
            const lowerQuery = query.toLowerCase();
            return allVideos.filter(video => 
                video.title.toLowerCase().includes(lowerQuery) ||
                video.channel.toLowerCase().includes(lowerQuery)
            );
        }

        function displayResults() {
            const results = searchVideos(query);
            const grid = document.getElementById('resultsGrid');
            const noResults = document.getElementById('noResults');
            const queryDisplay = document.getElementById('queryDisplay');
            const searchTitle = document.getElementById('searchTitle');
            
            queryDisplay.textContent = query;
            searchTitle.textContent = query ? 'Hasil Pencarian untuk "' + query + '"' : 'Semua Video';

            if (results.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
            } else {
                grid.style.display = 'grid';
                noResults.style.display = 'none';
                
                grid.innerHTML = results.map(video => `
                    <div class="video-card" onclick="window.location.href='${video.page}'">
                        <div class="video-thumbnail">
                            <img onclick="event.stopPropagation(); openModal(this.src)" src="https://via.placeholder.com/250x150/${video.color}/000000?text=Video" alt="${video.title}">
                        </div>
                        <div class="video-info">
                            <div class="video-title">${video.title}</div>
                            <div class="video-channel">${video.channel}</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        displayResults();

        // Modal functionality
        var modal = document.getElementById('imageModal');
        var modalImg = document.getElementById('modalImage');
        function openModal(src) {
            modal.style.display = "block";
            modalImg.src = src;
        }

        var span = document.getElementsByClassName("close")[0];
        span.onclick = function() {
            modal.style.display = "none";
        }
    </script>
</body>
</html>
